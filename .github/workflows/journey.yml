name: Middle-earth Journey

permissions:
  contents: write

on:
  push:
    paths:
      - "steps.json"

jobs:
  updateJourney:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Run Middle-earth engine
        run: |
          python engine/process_steps.py

      - name: Commit updated journey
        run: |
          git config user.name "Middle-earth Journey Bot"
          git config user.email "actions@github.com"
          git add docs/ || true
          git commit -m "Update journey map and journal" || echo "No changes to commit"
          git push
