<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Middle-earth Journey</title>
    <style>
        body {
            background: #1e1c1a;
            color: #f5f2e9;
            font-family: "Georgia", serif;
            margin: 40px;
            line-height: 1.6;
        }
        h1 {
            font-size: 2.4em;
            margin-bottom: 0.2em;
        }
        .map {
            margin: 30px 0;
            border: 4px solid #c2a878;
            width: 100%;
            max-width: 800px;
        }
        .journal-container {
            background: #2a2724;
            padding: 20px;
            border-left: 5px solid #c2a878;
            margin-top: 20px;
        }
        .journal-frame {
            width: 100%;
            height: 600px;
            border: none;
            background: #f5f2e9; /* parchment */
        }
        a {
            color: #c2a878;
        }
    </style>
</head>
<body>

    <h1>Middle-earth Journey</h1>
    <p>Your progress from the Shire to Rivendell updates automatically each time your steps are uploaded.</p>

    <h2>Current Map</h2>
    <img src="map.png?v=1" alt="Journey Map" class="map">

    <h2>Journey Journal</h2>
    <div class="journal-container">
        <iframe src="journal.md" class="journal-frame"></iframe>
    </div>

</body>
</html>
